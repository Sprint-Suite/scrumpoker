name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
      - 'feature/**'

jobs:
  checks:
    name: Node checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Chromium and its system libraries come preinstalled, so no apt step.
    # The tag must match the locked @playwright/test version.
    container: mcr.microsoft.com/playwright:v1.59.1-noble
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    permissions:
      contents: read

    defaults:
      run:
        working-directory: scrumpoker

    steps:
      # Both repos are checked out as siblings because this one resolves the
      # other by relative path: package.json pins @suite/auth-client as
      # file:../suite/shared/auth-client, and the theme drift guard reads the
      # Instrument foundation from ../suite/shared/theme. A lone checkout
      # leaves a dangling link that npm ci reports as success, so the failure
      # only surfaces later as a module-not-found in the test run.
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          path: scrumpoker

      - name: Check out the suite foundation alongside
        uses: actions/checkout@v6
        with:
          repository: davidmjackson/suite
          path: suite

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            scrumpoker/package-lock.json
            suite/shared/auth-client/package-lock.json

      # The auth-client is linked, not installed, so npm ci here does not pull
      # its dependencies (better-sqlite3 among them) into this tree — they have
      # to be installed in the sibling. Without this the link resolves and the
      # require still fails, one level deeper.
      - name: Install the suite auth-client's dependencies
        working-directory: suite/shared/auth-client
        run: npm ci --omit=dev

      - name: Install dependencies
        run: npm ci

      - name: Verify the suite link loads
        run: node -e "require('@suite/auth-client/lib/sessions-db')"

      - name: Check server syntax
        run: node --check server.js

      - name: Check Playwright config syntax
        run: node --check playwright.config.js

      - name: Check helper syntax
        run: |
          for file in lib/*.js; do
            node --check "$file"
          done

      - name: Check browser script syntax
        run: |
          for file in public/js/*.js; do
            node --check "$file"
          done

      - name: Check test syntax
        run: |
          for file in tests/*.test.js; do
            node --check "$file"
          done
          for file in tests/e2e/*.js; do
            node --check "$file"
          done

      - name: Run tests
        run: npm test

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Audit production dependencies
        run: npm audit --omit=dev
